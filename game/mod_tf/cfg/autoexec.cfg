// Runs at game startup, BEFORE any map loads. Anything that only takes effect
// at map load has to live here -- 1v1map.cfg is exec'd by round_manager.nut
// after the map is already up, which is too late for these.

// Lets round_manager.nut run server-console commands (exec 1v1map, bot_rl_solo)
// on this non-Valve map. It uses SendToServerConsole rather than SendToConsole
// because SourceTV takes player slot 1, and SendToConsole sends to slot 1. This
// allows ANY map loaded in this mod to run server commands -- fine for a mod
// that only ships your own map, worth knowing if you ever load others'.
sv_allow_point_servercommand always

// SourceTV: server-side spectator demos with a free-roam camera.
//
// The ds_enable demos in config.cfg are client (POV) demos: they only contain
// what the server sent to YOUR client, so anything outside your view at the
// time (the bot repositioning behind cover, etc.) is missing or frozen when you
// fly the camera around. SourceTV records from a spectator slot instead.
tv_enable 1        // only takes effect on the NEXT map load
tv_transmitall 1   // send every entity to SourceTV, not just what's in view
tv_autorecord 1    // start a SourceTV demo automatically on every map load

// SourceTV joins as a spectator player named "SourceTV". round_manager.nut
// skips spectators and the RL bot only targets live BLU humans, so it should
// not affect rounds.

// ghost.cfg turns the crosshair off for clean takes, and crosshair is an
// ARCHIVED cvar -- the game saves it to config.cfg on quit, so it stayed off in
// live games after a ghost session. autoexec runs after config.cfg, so this
// puts it back on every launch.
crosshair 1

// ---------------------------------------------------------------------------
// HLAE campath. Lives here, not in 1v1map.cfg, so it's active during demo
// playback too -- 1v1map.cfg only runs in a live game.
mirv_campath enabled 1
mirv_input enabled 1
mirv_fix animations 1
mirv_campath draw enabled 1     // path line + a marker at each keyframe
mirv_campath draw keyCam 1      // little camera at each key, facing its look direction

// Binds. The command must be quoted as ONE argument: bind takes exactly two args,
// so unquoted `bind "k" mirv_campath add` binds k to bare `mirv_campath` and
// throws "add" away. Several commands in one bind are separated by ; inside the
// quotes. The echo is console feedback -- not chat, since chat needs a server and
// there isn't one during demo playback.
bind "k" "mirv_campath add; echo [campath] keyframe ADDED"
bind "n" "mirv_campath clear; echo [campath] all keyframes CLEARED"
bind "y" "mirv_input camera; echo [campath] free camera toggled"
bind "p" "demo_togglepause; echo [demo] pause toggled"
bind "o" "mirv_campath print"

echo ""
echo "=== campath binds ==="
echo "  K  add keyframe at current time + view"
echo "  N  clear all keyframes"
echo "  Y  toggle free camera (mirv_input)"
echo "  P  pause / unpause demo"
echo "  O  print keyframe list"
echo "  save: mirv_campath save <name>   load: mirv_campath load <name>"
echo "  retime to now: mirv_campath edit start"
echo "=== jerry (live game only) ==="
echo "  F1 / F2 / F3  aim skill easy / medium / hard"
echo ""
