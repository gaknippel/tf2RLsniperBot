sv_cheats 1
mp_disable_respawn_times 1
mp_waitingforplayers_cancel 1
mp_waitingforplayers_time 0
tf_arena_preround_time 0
tf_arena_use_queue 0
tf_arena_first_blood 0
tf_bot_keep_class_after_death 1


// ---------------------------------------------------------------------------
// RL sniper bot ("jerry"). All of these are FCVAR_CHEAT, so they rely on the
// sv_cheats 1 above -- keep them below it.

// Which trained policy drives him.
//   late   - 60M steps. Sharpest: 100/92/66/86 win% across sim difficulties
//            0.00/0.50/0.75/1.00, kills in ~20 steps. Takes almost the same
//            line off spawn every round (62% of runs in one 45-degree wedge).
//   varied - 50M steps, trained on spawns spread along the whole spawn wall.
//            Genuinely different routes (17% busiest wedge, heading spread 98
//            degrees vs 7) but slower and softer: 98/80/46/62, ~125 steps.
//   early / mid - 500k and 6.1M checkpoints, for showing how his habits
//            changed. NOT difficulty settings; they duel about as well as late.
sniperbot_policy varied

// MUST match the policy above: "late" was trained on the map's fixed spawn,
// "varied" on a 330-unit spread. Mismatching them deploys a policy into a
// situation it never trained for.
//   late   -> 0
//   varied -> 330
sniperbot_spawn_spread 330

// The actual difficulty knob: easy / medium / hard. Controls the analytic aim
// (slew rate and settle error), which is what makes him easy or hard to fight.
// Swapping sniperbot_policy does NOT do this.
sniperbot_aim_skill medium

// 0-1 chance per round that he mirrors his opening strafe for ~1.2s. A scripted
// workaround for the same-route problem that "varied" solves properly; leave at
// 0 unless you want it on top of "late".
sniperbot_opening_variety 0

// Per-tick observation/action spew. Useful for debugging, noisy on stream.
sniperbot_debug 0

// mirv / campath setup and binds live in autoexec.cfg -- this file only runs in
// a live game (round_manager.nut execs it), never during demo playback, which is
// where campaths are actually used.

// Difficulty on the fly. sniperbot_aim_skill is read inside ApplyAction, which
// runs every tick, so these take effect mid-fight -- no respawn or map reload.
// Quoted as one argument each -- see the bind note in autoexec.cfg.
bind "F1" "sniperbot_aim_skill easy; echo [jerry] aim skill: EASY"
bind "F2" "sniperbot_aim_skill medium; echo [jerry] aim skill: MEDIUM"
bind "F3" "sniperbot_aim_skill hard; echo [jerry] aim skill: HARD"

echo "gaknippel's custom config loaded!"

