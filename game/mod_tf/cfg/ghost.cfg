// Ghost-take setup for screen capture (OBS / ShadowPlay). Run once per demo
// session, AFTER playdemo:
//     exec ghost
//
// Workflow per take (easiest: keep OBS recording across all takes, cut later):
//   1. scrub to the moment Jerry spawns and PAUSE there
//   2. F5  -> retimes the saved path to start now and unpauses, in one frame
//   3. let the pan finish
//   4. F6  -> pauses again
//
// Syncing takes in the editor: the demo is paused until F5, so each take opens
// on a frozen frame. The FIRST FRAME THAT MOVES is the moment the path started.
// Line every take up on that frame.

// Real-time playback. host_framerate would advance a fixed slice of game time
// per rendered frame, which is right for HLAE's frame-by-frame recording but
// wrong for screen capture: playback speed would then track your render
// framerate, so takes would run at different speeds and never line up. 0
// restores normal real-time playback, in case it was set earlier this session.
host_framerate 0

// Clean frame: no HUD, no crosshair.
cl_drawhud 0
crosshair 0

// Blood and decals OFF for the whole ghost session, takes and plate alike.
//
// Decals (blood splats, bullet holes) accumulate over a session, so every take
// has a different set on the walls depending on how many rounds came before it.
// A difference matte would read each splat missing from the plate as "part of
// the ghost" and cut it out, leaving stray blood floating in the ghost layers.
// Keeping them off everywhere makes every take's background match the plate.
// violence_hblood 0 stops blood effects being created at all during playback.
r_drawdecals 0
r_cleardecals
violence_hblood 0

// Camera follows the path.
mirv_campath enabled 1

bind "F5" "mirv_campath load ghostpan; mirv_campath edit start; demo_resume; echo [ghost] take STARTED"
bind "F6" "demo_pause; echo [ghost] take ENDED"

// F7 toggles all players (and other non-world models) on/off, for recording a
// clean plate: run the same F5 pan with players hidden to get just the empty
// arena, which a difference matte can then cut each take's Jerry out against.
// r_drawothermodels is a cheat cvar; demo playback normally allows it, but if it
// says it's cheat-protected, run sv_cheats 1 before playdemo.
//
// r_shadows goes with it: player shadows are a separate render-to-texture pass
// projected onto the floor, so hiding the models alone leaves their shadows
// behind on the plate. Takes keep shadows ON, so each ghost's difference matte
// picks up his shadow along with him -- which is what you want.
alias plate_on "r_drawothermodels 0; r_shadows 0; r_drawparticles 0; echo [ghost] players HIDDEN (clean plate); alias plate_toggle plate_off"
alias plate_off "r_drawothermodels 1; r_shadows 1; r_drawparticles 1; echo [ghost] players SHOWN; alias plate_toggle plate_on"
alias plate_toggle plate_on
bind "F7" "plate_toggle"

echo "[ghost] ready -- pause on a spawn, F5 start take, F6 pause, F7 toggle players (clean plate)"
